<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>순발력 연타 웹게임</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef1eb; color: #17241c; font-family: system-ui, "Malgun Gothic", sans-serif; }
    main { width: min(100%, 720px); padding: clamp(24px, 5vw, 48px); border: 1px solid #00462a; border-radius: 8px; background: white; }
    .label { margin: 0 0 12px; color: #00462a; font-size: 14px; font-weight: 700; }
    h1 { margin: 0 0 16px; font-size: clamp(24px, 5vw, 36px); }
    
    /* 스테이지 및 디스플레이 영역 */
    #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 260px; margin: 20px 0; padding: 20px; background: #f3f5f1; border: 1px solid #d8ded7; border-radius: 8px; text-align: center; position: relative; overflow: hidden; }
    #status-bar { width: 100%; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 12px; }
    #timer-bar { width: 100%; height: 8px; background: #ddd; margin-bottom: 16px; border-radius: 4px; overflow: hidden; }
    #timer-fill { height: 100%; width: 100%; background: #e74c3c; transition: width 0.1s linear; }

    /* 모션 비주얼 */
    .visual-box { height: 80px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; margin-bottom: 12px; }
    .falling-phone { transition: transform 0.1s ease; }
    .traffic-light { display: flex; gap: 8px; background: #333; padding: 6px 12px; border-radius: 20px; font-size: 24px; }
    .light { opacity: 0.3; }
    .light.active { opacity: 1; filter: drop-shadow(0 0 6px currentColor); }

    /* 키보드 그래픽 */
    .keyboard-preview { display: flex; flex-direction: column; gap: 6px; background: #222; padding: 12px; border-radius: 8px; margin-top: 10px; }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .key { width: 36px; height: 36px; background: #444; color: white; display: grid; place-items: center; border-radius: 4px; font-weight: bold; font-size: 14px; border: 1px solid #555; }
    .key.space { width: 140px; }
    .key.target { background: #ff9800; color: #000; font-size: 18px; border-color: #e65100; animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

    #message { margin: 12px 0 0; font-size: 18px; font-weight: bold; color: #00462a; }
    
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    button { padding: 12px 20px; border: 1px solid #00462a; border-radius: 4px; background: #00462a; color: white; font: inherit; cursor: pointer; font-weight: bold; }
    #restart { background: white; color: #00462a; }
    button:disabled { opacity: .4; cursor: default; }

    .guide { margin-top: 24px; padding: 20px; border: 1px solid #d8ded7; background: #f8faf6; border-radius: 6px; }
    .guide h2 { margin: 0 0 8px; font-size: 18px; }
    .guide ul { margin: 0; padding-left: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="label">KING · 순발력 키보드 게임</p>
    <h1>위기 탈출! 순발력 연타 게임</h1>
    <p>화면에 지정되는 <b>주황색 키</b>를 제한 시간 안에 지정된 횟수만큼 누르세요!</p>

    <section id="stage" aria-label="게임 진행 화면">
      <div id="status-bar">
        <span id="stage-title">준비 완료</span>
        <span id="count-info">남은 횟수: -</span>
      </div>
      <div id="timer-bar"><div id="timer-fill"></div></div>

      <!-- 게임 연출 아이콘/애니메이션 -->
      <div class="visual-box" id="visual-area">
        <span>🎮</span>
      </div>

      <!-- 키보드 레이아웃 시각화 -->
      <div class="keyboard-preview">
        <div class="kb-row">
          <div class="key" data-key="Q">Q</div>
          <div class="key" data-key="W">W</div>
          <div class="key" data-key="E">E</div>
          <div class="key" data-key="R">R</div>
          <div class="key" data-key="T">T</div>
        </div>
        <div class="kb-row">
          <div class="key" data-key="A">A</div>
          <div class="key" data-key="S">S</div>
          <div class="key" data-key="D">D</div>
          <div class="key" data-key="F">F</div>
          <div class="key" data-key="G">G</div>
        </div>
        <div class="kb-row">
          <div class="key space" data-key=" ">SPACE</div>
        </div>
      </div>

      <p id="message">시작 버튼을 눌러 게임을 시작하세요!</p>
    </section>

    <div class="buttons">
      <button id="start" type="button">게임 시작</button>
      <button id="restart" type="button" disabled>다시 시작</button>
    </div>

    <section class="guide">
      <h2>스테이지 구성</h2>
      <ul>
        <li><b>1단계:</b> 떨어지는 휴대폰 잡기 (제한시간 3초 / 키 5회 연타)</li>
        <li><b>2단계:</b> 5초 남은 신호등 건너기 (제한시간 5초 / 키 10회 연타)</li>
      </ul>
    </section>
  </main>

  <script>
    // 상태 및 엘리먼트 정의
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start');
    const restartBtn = document.getElementById('restart');
    const stageTitle = document.getElementById('stage-title');
    const countInfo = document.getElementById('count-info');
    const timerFill = document.getElementById('timer-fill');
    const visualArea = document.getElementById('visual-area');
    const keys = document.querySelectorAll('.key');

    const AVAILABLE_KEYS = ['Q', 'W', 'E', 'R', 'T', 'A', 'S', 'D', 'F', 'G', ' '];

    let currentStage = 0;
    let targetKey = '';
    let remainingClicks = 0;
    let timeLimit = 0;
    let timerId = null;
    let intervalId = null;
    let timeRemaining = 0;
    let isPlaying = false;

    // 스테이지 설정
    const STAGES = [
      {
        title: "STAGE 1: 떨어지는 휴대폰 잡기! 📱",
        time: 3.0,
        clicks: 5,
        visual: () => `<div class="falling-phone" id="phone">📱</div>`
      },
      {
        title: "STAGE 2: 5초 남은 신호등 건너기! 🚦",
        time: 5.0,
        clicks: 10,
        visual: () => `<div class="traffic-light"><span class="light active" style="color:#2ecc71">🟢</span></div> 🚶‍♂️`
      }
    ];

    function getRandomKey() {
      const idx = Math.floor(Math.random() * AVAILABLE_KEYS.length);
      return AVAILABLE_KEYS[idx];
    }

    function setTargetKey(key) {
      targetKey = key;
      keys.forEach(k => {
        if (k.dataset.key === targetKey) {
          k.classList.add('target');
        } else {
          k.classList.remove('target');
        }
      });
    }

    function startStage(stageIdx) {
      currentStage = stageIdx;
      const stage = STAGES[stageIdx];
      
      stageTitle.textContent = stage.title;
      remainingClicks = stage.clicks;
      timeLimit = stage.time;
      timeRemaining = timeLimit;

      countInfo.textContent = `남은 횟수: ${remainingClicks}`;
      visualArea.innerHTML = stage.visual();
      
      const nextKey = getRandomKey();
      setTargetKey(nextKey);

      message.textContent = `키 [ ${nextKey === ' ' ? 'SPACE' : nextKey} ] 를 빠르게 누르세요!`;
      
      // 타이머 시작
      const updateInterval = 50; // ms
      timerFill.style.width = '100%';

      clearInterval(intervalId);
      intervalId = setInterval(() => {
        timeRemaining -= (updateInterval / 1000);
        const percent = Math.max(0, (timeRemaining / timeLimit) * 100);
        timerFill.style.width = `${percent}%`;

        // Stage 1 애니메이션
        if (currentStage === 0) {
          const phone = document.getElementById('phone');
          if (phone) {
            const dropAmount = (1 - (timeRemaining / timeLimit)) * 40;
            phone.style.transform = `translateY(${dropAmount}px)`;
          }
        }

        if (timeRemaining <= 0) {
          clearInterval(intervalId);
          gameOver(false);
        }
      }, updateInterval);
    }

    function handleKeyPress(e) {
      if (!isPlaying) return;

      const pressedKey = e.key.toUpperCase();
      if (pressedKey === targetKey || (e.key === ' ' && targetKey === ' ')) {
        remainingClicks--;
        countInfo.textContent = `남은 횟수: ${remainingClicks}`;

        if (remainingClicks > 0) {
          // 다음 입력할 무작위 키 선택
          setTargetKey(getRandomKey());
          message.textContent = `키 [ ${targetKey === ' ' ? 'SPACE' : targetKey} ] 를 누르세요!`;
        } else {
          // 스테이지 성공
          clearInterval(intervalId);
          if (currentStage + 1 < STAGES.length) {
            message.textContent = "성공! 다음 스테이지로 이동합니다...";
            setTimeout(() => {
              startStage(currentStage + 1);
            }, 1000);
          } else {
            gameOver(true);
          }
        }
      }
    }

    function gameOver(isWin) {
      isPlaying = false;
      setTargetKey('');
      clearInterval(intervalId);

      if (isWin) {
        stageTitle.textContent = "🎉 미션 완료!";
        message.textContent = "축하합니다! 휴대폰도 구하고 신호등도 안전하게 건넜습니다!";
        visualArea.innerHTML = "🏆✨";
      } else {
        stageTitle.textContent = "💥 실패!";
        if (currentStage === 0) {
          message.textContent = "휴대폰이 바닥에 떨어져 깨졌습니다!";
          visualArea.innerHTML = "📱💥";
        } else {
          message.textContent = "신호등 불이 빨간색으로 바뀌었습니다!";
          visualArea.innerHTML = "🚦🔴";
        }
      }

      startBtn.disabled = true;
      restartBtn.disabled = false;
      restartBtn.focus();
    }

    // 이벤트 리스너 등록
    startBtn.addEventListener('click', () => {
      isPlaying = true;
      startBtn.disabled = true;
      restartBtn.disabled = false;
      startStage(0);
    });

    restartBtn.addEventListener('click', () => {
      isPlaying = true;
      startStage(0);
    });

    window.addEventListener('keydown', (e) => {
      // 스페이스바 누를 때 페이지 스크롤 방지
      if (e.key === ' ' && isPlaying) {
        e.preventDefault();
      }
      handleKeyPress(e);
    });
  </script>
</body>
</html>
